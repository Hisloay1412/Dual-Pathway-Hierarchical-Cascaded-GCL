# ==============================================================================
# Metrology-Oriented NeRF Configuration
# ==============================================================================

monerf:
  # ------------------------------------------------------------------
  # Field  (Sec. 3.1, MONeRFField)
  # ------------------------------------------------------------------
  field:
    mlp_hidden_dim: 256
    mlp_num_layers: 8
    head_mlp_num_layers: 2
    head_mlp_layer_width: 128
    encoding:
      pos_enc_num_freqs: 10
      dir_enc_num_freqs: 4
    use_view_dependence: true
    metrology_feature_dim: 32              # field_output_metrology.out_features

  # ------------------------------------------------------------------
  # Sampler  (build_sampler)
  # ------------------------------------------------------------------
  sampling:
    num_samples: 256                       # uniform single-stage
    use_proposal: false
    num_coarse_samples: 64                 # only used when use_proposal=true
    num_fine_samples: 128
    near: 0.1
    far: 2.0

  # ------------------------------------------------------------------
  # Renderer  (MONeRFRenderers)
  # ------------------------------------------------------------------
  renderer:
    background_color: "random"
    compute_normals: true                  # Eq. 11
    render_metrology: true

  # ------------------------------------------------------------------
  # Losses  (Eq. 12, 13, 20, 21, 22, 23)
  # ------------------------------------------------------------------
  losses:
    lambda_photo: 1.0                      # L_photo (Sec. 2.2)
    lambda_depth: 0.1                      # Eq. 12
    lambda_normal: 0.05                    # Eq. 13
    lambda_defocus: 0.1                    # Eq. 20
    lambda_tv: 1.0e-4                      # Eq. 23
    # self-bootstrapping term weights (Eq. 22)
    mu_depth: 0.1                          # Eq. 21
    mu_normal: 0.05

  # ------------------------------------------------------------------
  # Defocus module  (DepthAdaptiveDefocusBlur, Sec. 3.1.2)
  # ------------------------------------------------------------------
  defocus:
    enabled: true
    focal_length_mm: 35.0                  # f, must NOT be null
    f_number: 2.8                          # N
    focus_distance_m: 1.5                  # z_f
    beta: 1.5                              # sigma_blur = beta * c(z)
    blur_kernel_size: 15
    sigma_min: 0.1
    sigma_max: 10.0
    use_depth_adaptive_conv: true

  # ------------------------------------------------------------------
  # Self-bootstrapping schedule  (Eq. 22)
  # ------------------------------------------------------------------
  self_bootstrapping:
    enabled: true
    gamma_0: 0.1                           # gamma(t) = gamma_0 + (1-gamma_0) e^{-t/tau}
    tau: 5.0
    use_w_conf_gating: true                # gate by Tier-3 w_conf (Sec. 3.1.3)

  # ------------------------------------------------------------------
  # Camera pose inversion  (iNeRF, Sec. 2.2 Eq. 10)
  # ------------------------------------------------------------------
  pose_inversion:
    enabled: true
    mode: "SO3xR3"                         # CameraOptimizerConfig.mode
    optimizer: Adam
    lr: 1.0e-3
    iterations: 500
    tol: 1.0e-6
    loss: photometric

  # ------------------------------------------------------------------
  # Training
  # ------------------------------------------------------------------
  training:
    optimizer: Adam
    lr: 5.0e-4
    batch_size: 1024
    epochs: 200
    lr_schedule: cosine